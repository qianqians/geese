[package]
name = "animation-preview"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "animation-preview"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "22.1"
cgmath = "0.18"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"

egui = "0.29"
egui-winit = "0.29"
egui-wgpu = "0.29"
rfd = "0.15"

render = { path = "../../../crates/render", features = ["instancing"] }
material = { path = "../../../crates/material" }
camera = { path = "../../../crates/camera" }
scene = { path = "../../../crates/scene" }
edit-prefs = { path = "../prefs" }
